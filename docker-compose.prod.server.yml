services:
  pufferblow-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pufferblow-server
    restart: unless-stopped
    ports:
      - "7575:7575"
    environment:
      # If empty, the server falls back to config.toml in pufferblow_data.
      # The default below assembles a URI against the bundled postgres
      # service using the values you set in .env, so a fresh stack works
      # out of the box.
      PUFFERBLOW_DATABASE_URI: ${PUFFERBLOW_DATABASE_URI:-postgresql://${POSTGRES_USER:-pufferblow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pufferblow}}
      PUFFERBLOW_API_HOST: ${PUFFERBLOW_API_HOST:-0.0.0.0}
      PUFFERBLOW_API_PORT: ${PUFFERBLOW_API_PORT:-7575}
      # Memcache is required in v1.0 — the API uses it to cache the
      # hot read paths (Users by id, Server singleton). The bundled
      # memcached service below is the default target. An operator
      # pointing at an external memcache cluster can override
      # PUFFERBLOW_MEMCACHE_HOST in .env.
      PUFFERBLOW_MEMCACHE_HOST: ${PUFFERBLOW_MEMCACHE_HOST:-memcached}
      PUFFERBLOW_MEMCACHE_PORT: ${PUFFERBLOW_MEMCACHE_PORT:-11211}
    volumes:
      - pufferblow_data:/root/.pufferblow
    depends_on:
      postgres:
        condition: service_healthy
      memcached:
        condition: service_started
    healthcheck:
      # /readyz mirrors instance health: returns 200 once the API has
      # finished bootstrap (DB connect + manager wiring). media-sfu waits
      # on this rather than `service_started` so it doesn't race past
      # the bootstrap callback endpoint not being ready yet.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:7575/readyz', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - pufferblow-server-net

  media-sfu:
    build:
      context: ${MEDIA_SFU_GIT_CONTEXT:-https://github.com/pufferblow/media-sfu.git}
      dockerfile: Dockerfile
    container_name: pufferblow-media-sfu
    restart: unless-stopped
    command: ["-config", "/root/.pufferblow/config.toml"]
    ports:
      - "8787:8787"
      - "${RTC_UDP_PORT_MIN:-50000}-${RTC_UDP_PORT_MAX:-50199}:${RTC_UDP_PORT_MIN:-50000}-${RTC_UDP_PORT_MAX:-50199}/udp"
    volumes:
      - pufferblow_data:/root/.pufferblow
    depends_on:
      pufferblow-server:
        condition: service_healthy
    networks:
      - pufferblow-server-net

  coturn:
    image: instrumentisto/coturn:latest
    container_name: pufferblow-coturn
    restart: unless-stopped
    command: >
      -n
      --log-file=stdout
      --listening-port=3478
      --realm=${TURN_REALM:-pufferblow.space}
      --user=${PUFFERBLOW_TURN_USERNAME:-pufferblow}:${PUFFERBLOW_TURN_PASSWORD}
      --fingerprint
      --lt-cred-mech
      --no-multicast-peers
      --min-port=49160
      --max-port=49200
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    networks:
      - pufferblow-server-net

  postgres:
    image: postgres:16-alpine
    container_name: pufferblow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pufferblow}
      POSTGRES_USER: ${POSTGRES_USER:-pufferblow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pufferblow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pufferblow} -d ${POSTGRES_DB:-pufferblow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pufferblow-server-net

  memcached:
    # Pinned to alpine for the same reason postgres is: tiny images
    # the operator can read end-to-end. The official `memcached`
    # image is built on Debian; the alpine variant is ~10 MB vs
    # ~80 MB and ships the same binary.
    image: memcached:1.6-alpine
    container_name: pufferblow-memcached
    restart: unless-stopped
    # Daemon flags (defense in depth on top of the no-host-port + private-
    # network topology described below):
    #
    #   -m <MB>      In-memory budget. The v1.0 cache footprint is small
    #                (Users + Server + ServerSettings rows + per-IP rate
    #                counters + per-channel rows) — 128 MB is comfortable
    #                for a 100K-online instance. Bump via .env if the cache
    #                hit ratio drops as the keyspace grows.
    #
    #   -l <ADDR>    Bind address. We hardwire `0.0.0.0` so the daemon
    #                listens on the container's bridge interface — that
    #                interface is the private Docker network only — and
    #                NOT on the loopback alone. This is the same shape
    #                memcached's own Dockerfile defaults to, made explicit
    #                so an operator who edits this file can see what's
    #                bound and where.
    #
    #   -U 0         Disable UDP entirely. UDP is the amplification-attack
    #                vector that put memcached on the news in 2018
    #                (reflectors at 50,000× amp). The wrapper at
    #                `api/cache/memcache.py` only uses TCP, so UDP is
    #                pure attack surface. Off.
    #
    #   --enable-shutdown
    #                Lets `docker stop` send SIGINT and have the daemon
    #                flush + exit cleanly instead of getting SIGKILLed
    #                after the 10s grace period.
    command:
      - memcached
      - -m
      - ${PUFFERBLOW_MEMCACHE_MEMORY_MB:-128}
      - -l
      - 0.0.0.0
      - -U
      - "0"
      - --enable-shutdown
    # No host port mapped — the cache lives on the internal network
    # and the server reaches it by service name. Exposing 11211 on
    # the host would let any process on the host run commands; the
    # daemon has no auth, so the right deployment shape is "private
    # network + service-name DNS". If you ever need to debug from
    # outside the network use `docker exec -it pufferblow-memcached
    # nc 127.0.0.1 11211` — never publish 11211.
    networks:
      - pufferblow-server-net

volumes:
  pufferblow_data:
  pufferblow_postgres:

networks:
  pufferblow-server-net:
    driver: bridge
