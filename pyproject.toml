[tool.poetry]
name = "pufferblow"
version = "0.0.1-beta"
description = "Self-hosted, open-source community server with encrypted messaging, ActivityPub federation, voice channels, and role-based access control"
authors = ["ramsy0dev <ramsy0dev@gmail.com>"]
license = "GPL-3.0"
readme = "README.md"
packages = [
    {include = "pufferblow"}
]

[tool.poetry.dependencies]
# Bumped from 3.10 → 3.11 so we can drop the `tomli` dep (tomllib
# became stdlib in 3.11). This is the only deliberate floor bump
# during the dep-trim pass; everything else is still installable on
# 3.10 if needed.
python = "^3.11"
fastapi = "^0.115.12"
# `typer` removed — the CLI now uses argparse from the stdlib. Saved
# the typer + click runtimes plus their transitive deps.
# `textual` removed — the textual_setup wizard was never wired up.
# `sqlalchemy-utils` removed — the only used helper, `database_exists`,
# is now implemented inline against the SQLAlchemy engine in
# `pufferblow/api/database/database.py`.
# `tomli` removed — replaced by stdlib `tomllib`.
rich = "^14.2.0"
pycryptodome = "^3.23.0"
loguru = "^0.7.3"
pytz = "^2025.2"
psycopg2-binary = "^2.9.10"
sqlalchemy = "^2.0.44"
websockets = "^15.0"
httpx = "^0.28.1"
orjson = "^3.11.3"
pymemcache = "^4.0.0"
cryptography = "^46.0.2"
bcrypt = "^5.0.0"
watchdog = "^6.0.0"
python-magic = "^0.4.27"
pillow = "^12.0.0"
python-multipart = ">=0.0.22,<0.0.32"
psutil = "^7.1.0"
boto3 = "^1.34.0"
gunicorn = "^23.0.0"

[tool.poetry.group.dev.dependencies]
# pytest / pytest-asyncio moved here from the main dependencies group
# — they're test-only and pulling them at runtime added wheels every
# `poetry install` had to fetch. `basedpyright` moved here too: it's
# a type-checker, not a runtime import.
loguru = "^0.7.3"
black = "^26.3.1"
isort = "^5.13.2"
ruff = "^0.8.0"
pre-commit = "^4.0.1"
pytest = ">=8.4.2,<10.0.0"
pytest-asyncio = "^1.2.0"
basedpyright = "^1.31.7"

# Optional docs group. Install with `poetry install --with docs` when you
# want to build the MkDocs site locally or via the docs.yml CI workflow.
# These deps are not pulled by `poetry install` alone so a contributor who
# only cares about the server isn't paying for them.
[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.5.49"
mkdocs-render-swagger-plugin = "^0.1.2"

[tool.poetry.plugins."console_scripts"]
pufferblow = "pufferblow:run"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pyprojectx]
main = ["pdm==2.12.4"]  # installs pdm to your project instead of globally

[tool.pdm.dev-dependencies]  # or the poetry equivalent
dev = [
    "basedpyright", # you can pin the version here if you want, or just rely on the lockfile
]

[tool.basedpyright]
# many settings are not enabled even in strict mode, which is why basedpyright includes an "all" option
# you can then decide which rules you want to disable
typeCheckingMode = "standard"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["pufferblow"]
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"] # assert false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "loguru.*",
    "psycopg2.*",
    "cryptography.*",
    "bcrypt.*",
    "magic.*",
    "PIL.*",
    "boto3.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
