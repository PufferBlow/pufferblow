[alembic]
# Developer convenience only — e.g. `alembic revision --autogenerate -m "..."`
# while the repo is checked out. The app itself never reads this file: it
# builds its own `Config` in code (see `pufferblow/api/database/migrations.py`)
# and applies migrations automatically at boot, so nobody runs
# `alembic upgrade head` by hand against a real instance.
script_location = pufferblow/migrations

# Overridden by `-x db_url=...` or the DATABASE_URL/PUFFERBLOW_DATABASE_URI
# env var read in migrations/env.py for anything beyond `--autogenerate`
# against a local throwaway database; left blank here on purpose so a
# mistyped `alembic upgrade head` can't accidentally hit a real database.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
